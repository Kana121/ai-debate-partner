# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Logging
logging.level.root=INFO
logging.level.com.aidebatepartner=DEBUG

# CORS Configuration
cors.allowed-origins=*
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# OpenAI Configuration
openai.api.key=${OPENAI_API_KEY:your-openai-api-key}
openai.api.model=gpt-4
openai.api.timeout=60

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# WebSocket Configuration
app.websocket.endpoint=/ws
app.websocket.topic.prefix=/topic
app.websocket.application.prefix=/app
